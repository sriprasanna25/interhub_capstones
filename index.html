<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse internships and apply securely in under two minutes.">
  <meta name="color-scheme" content="light dark">
  <title>InternHub: Find your first internship</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M9 22V10h4l3 7 3-7h4v12h-3v-7l-3 7h-2l-3-7v7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top">
    <div class="wrap">
      <h1>InternHub</h1>
      <p>Find your first internship and apply in two minutes.</p>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <section aria-labelledby="list-h">
      <h2 id="list-h">Open internships</h2>
      <label class="field" for="search">Search by role, company, or city</label>
      <input id="search" type="search" maxlength="50" autocomplete="off" placeholder="e.g. Remote, security, Coimbatore">

      <div id="status" role="status" aria-live="polite"></div>
      <ul id="list" class="cards" aria-label="Internships"></ul>
      <button id="more" type="button" class="secondary" hidden>Load more</button>
    </section>
  </main>

  <footer class="wrap foot">
    <p>Built as a full-stack capstone. <a href="/healthz">Service status</a></p>
  </footer>

  <dialog id="apply-dialog" aria-labelledby="apply-h">
    <form id="apply-form" novalidate>
      <div class="dialog-head">
        <h2 id="apply-h">Apply: <span id="apply-title"></span></h2>
        <button id="close" type="button" class="icon" aria-label="Close application form">✕</button>
      </div>

      <label class="field" for="f-name">Full name</label>
      <input id="f-name" name="name" autocomplete="name" maxlength="80" required aria-describedby="err-name">
      <p class="err" id="err-name"></p>

      <label class="field" for="f-email">Email</label>
      <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="120" required aria-describedby="err-email">
      <p class="err" id="err-email"></p>

      <label class="field" for="f-phone">Phone <span class="opt">(optional)</span></label>
      <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" aria-describedby="err-phone">
      <p class="err" id="err-phone"></p>

      <label class="field" for="f-resume">Resume link <span class="opt">(optional, https only)</span></label>
      <input id="f-resume" name="resumeUrl" type="url" inputmode="url" maxlength="300" aria-describedby="err-resumeUrl">
      <p class="err" id="err-resumeUrl"></p>

      <label class="field" for="f-cover">Cover letter</label>
      <textarea id="f-cover" name="coverLetter" rows="5" maxlength="1000" required aria-describedby="count err-coverLetter"></textarea>
      <p class="count" id="count">0 / 1000</p>
      <p class="err" id="err-coverLetter"></p>

      <p class="err" id="form-error" role="alert"></p>
      <p class="ok" id="form-ok" role="status" tabindex="-1"></p>

      <div class="actions">
        <button id="submit" type="submit">Submit application</button>
        <button id="cancel" type="button" class="secondary">Cancel</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
